services:
  # ---------------- Backbone ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: kksiem-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [siem]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kksiem-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Replace 192.168.50.X with this host's actual OPT4 IP so external
      # collectors (Winlogbeat/Fluent Bit on other segments) can reach it.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.50.30:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [siem]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: kksiem-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: {soft: -1, hard: -1}
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks: [siem]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: kksiem-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [siem]

  # Externalized correlation state for Agent 3 (Layer 5). Replaces v1's
  # original in-memory dict, which lost all in-flight correlations on
  # restart and couldn't be shared across multiple Agent 3 replicas.
  redis:
    image: redis:7.4-alpine
    container_name: kksiem-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [siem]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Layer 0 cold tier - S3-compatible object storage. Speaks the same API
  # as real AWS S3 (see kksiem/storage/object_store_client.py), so moving
  # to cloud later is an env var change (OBJECT_STORE_ENDPOINT_URL,
  # credentials), not a code change.
  #
  # NOTE: the official minio/minio repository was archived by its owner in
  # April 2026, and its Docker Hub tags have proven unreliable (a GitHub
  # source release tag doesn't guarantee a matching Docker Hub image tag
  # exists). Using pgsty/minio instead - an actively maintained fork still
  # publishing images as of mid-2026. Since the object store client speaks
  # plain S3 API, swapping to any other S3-compatible image is a one-line
  # change here if this fork's status changes too - verify at
  # https://hub.docker.com/r/pgsty/minio/tags before relying on this long-term.
  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: kksiem-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-kksiem-admin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-kksiem-secret-change-me}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # web console
    networks: [siem]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Central Fluent Bit - receives pfSense syslog on the KKSIEM host itself
  fluent-bit-pfsense:
    image: fluent/fluent-bit:3.1
    container_name: kksiem-fluentbit-pfsense
    volumes:
      - ./kksiem/collectors/configs/fluent-bit-pfsense.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "5140:5140/udp"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on: [kafka]
    networks: [siem]

  # ---------------- Python services ----------------
  # One-shot init: creates Kafka topics, OpenSearch index template, and the
  # MinIO bucket. Runs to completion and exits (restart: "no") - the
  # normalizer/agents/api all depend on this finishing successfully before
  # they start, so topics/template always exist before anything tries to
  # produce/consume. Idempotent - safe on every `docker compose up`.
  setup:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-setup
    command: ["python", "run.py", "setup"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"
    networks: [siem]

  normalizer:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-normalizer
    command: ["python", "run.py", "normalizer"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
      REDIS_HOST: redis
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
    volumes:
      - /home/light/code/logs:/home/light/code/logs
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [siem]

  agent1:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-agent1
    command: ["python", "run.py", "agent1"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [siem]

  agent2:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-agent2
    command: ["python", "run.py", "agent2"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [siem]

  agent3:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-agent3
    command: ["python", "run.py", "agent3"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
      REDIS_HOST: redis
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [siem]

  # Note: there is no "agent4" service here - Agent 4 (verification) is
  # called in-process by Agent 3, not a standalone Kafka-consuming service.
  # See run.py's module docstring and agents/agent4_verification.py.

  sigma:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-sigma
    command: ["python", "run.py", "sigma"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [siem]

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: kksiem-api
    command: ["python", "run.py", "api"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
      REDIS_HOST: redis
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      kafka: { condition: service_started }
      opensearch: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [siem]

networks:
  siem:
    driver: bridge

volumes:
  opensearch-data:
  redis-data:
  minio-data: