# Fluent Bit config: runs LOCALLY on any Linux host you want log visibility
# from (Debian/Ubuntu/etc). Tails auditd log + syslog, tags with THIS
# host's identity, ships to Kafka raw.linux. One template, reused per host -
# set HOST_NAME / HOST_IP / HOST_SEGMENT via environment before starting
# (see deploy script). Do NOT hardcode segment/host/ip in this file itself -
# if you deploy this same file to two different machines (e.g. your Debian
# server and Kali) without changing the env vars, both would silently claim
# the same identity and corrupt correlation/asset lookups downstream.
#
# IMPORTANT: the output JSON keys here must exactly match kksiem.schemas.
# canonical.RawMessage's fields (host, ip, segment, source_type, log_type,
# collector, raw) - the normalizer does RawMessage(**parsed), a direct
# kwarg unpack. Any mismatch fails Pydantic validation and routes to DLQ.
#
# The tail plugin's default behavior: unstructured lines are appended as a
# string under the key `log`, not `raw`. The `Key raw` option below renames
# that field at the input level, so no separate rename filter is needed.

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    Path         /var/log/audit/audit.log
    Tag          linux.auditd
    Key          raw
    DB           /var/lib/fluent-bit/kksiem-auditd.db
    Refresh_Interval 5
    Read_from_Head true

[INPUT]
    Name         tail
    Path         /var/log/auth.log
    Tag          linux.syslog
    Key          raw
    DB           /var/lib/fluent-bit/kksiem-syslog.db
    Refresh_Interval 5
    Read_from_Head true

[FILTER]
    Name          modify
    Match         linux.auditd
    Add           log_type    auditd
    Add           collector   fluent-bit
    Add           source_type ${HOST_SOURCE_TYPE}
    Add           host        ${HOST_NAME}
    Add           ip          ${HOST_IP}
    Add           segment     ${HOST_SEGMENT}

[FILTER]
    Name          modify
    Match         linux.syslog
    Add           log_type    syslog
    Add           collector   fluent-bit
    Add           source_type ${HOST_SOURCE_TYPE}
    Add           host        ${HOST_NAME}
    Add           ip          ${HOST_IP}
    Add           segment     ${HOST_SEGMENT}

[OUTPUT]
    Name         kafka
    Match        linux.*
    Brokers      ${KAFKA_BROKERS}
    Topics       raw.linux
    Format       json
