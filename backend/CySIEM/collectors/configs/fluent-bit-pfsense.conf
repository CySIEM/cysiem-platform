# Fluent Bit config: receives pfSense syslog, tags it, ships to Kafka raw.firewall
# Runs on the KKSIEM host (OPT4). Point pfSense's remote syslog target at this host, port 5140/udp.
#
# IMPORTANT: the output JSON keys here must exactly match kksiem.schemas.
# canonical.RawMessage's fields (host, ip, segment, source_type, log_type,
# collector, raw) - the normalizer does RawMessage(**parsed), a direct
# kwarg unpack. Any mismatch fails Pydantic validation and routes to DLQ.

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name         syslog
    Listen       0.0.0.0
    Port         5140
    Mode         udp
    Parser       syslog-rfc3164
    Tag          firewall.pfsense

# syslog-rfc3164 parses into: message (the payload), host (syslog header
# hostname - pfSense sends its own hostname here), pri, ...
# We rename `message` -> `raw` because RawMessage requires `raw`, not
# `message`, then add the remaining required fields. All done in one
# `modify` filter instance - Rename is a rule within `modify`, not a
# separate plugin. Rules apply in order, each operating on the previous
# rule's result.
[FILTER]
    Name          modify
    Match         firewall.*
    Rename        message     raw
    Add           log_type    pfsense_filterlog
    Add           collector   fluent-bit
    Add           source_type firewall
    Add           segment     LAN

# `host` from the syslog parser is kept as-is since it already matches
# what RawMessage expects, PROVIDED pfSense's syslog client sends a
# consistent hostname - verify this once you see real traffic (Status >
# System Logs on pfSense shows the hostname it's sending).
#
# Fluent Bit's syslog parser leaves extra fields (pri, syslog_ident, etc)
# in the record beyond what RawMessage expects. Pydantic accepts/ignores
# extra fields by default, so this is safe as shipped.
[OUTPUT]
    Name         kafka
    Match        firewall.*
    Brokers      ${KAFKA_BROKERS}
    Topics       raw.firewall
    Format       json
